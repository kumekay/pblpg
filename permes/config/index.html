<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>permes settings</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f1ea;
      color: #18201c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 34rem; margin: 0 auto; padding: 2rem 1rem max(2rem, env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 .35rem; font-size: 2rem; }
    .intro { margin: 0 0 1.75rem; color: #58615d; line-height: 1.45; }
    label { display: block; margin: 1rem 0 .4rem; font-weight: 650; }
    input {
      width: 100%; min-height: 3rem; padding: .7rem .8rem;
      border: 1px solid #a8afab; border-radius: .55rem;
      background: #fff; color: #18201c; font: inherit;
    }
    input:focus { border-color: #087f5b; outline: 3px solid rgba(8, 127, 91, .2); }
    .hint { display: block; margin-top: .35rem; color: #66706b; font-size: .85rem; line-height: 1.35; }
    button {
      width: 100%; min-height: 3.2rem; margin-top: 1.5rem; border: 0;
      border-radius: .55rem; background: #087f5b; color: #fff;
      font: 700 1rem inherit; cursor: pointer;
    }
    button:active { background: #066b4d; }
    #error { min-height: 1.4rem; margin: .75rem 0 0; color: #b42318; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      :root { background: #151a17; color: #edf3ef; }
      .intro, .hint { color: #adb8b1; }
      input { background: #242b27; border-color: #68726c; color: #fff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>permes</h1>
    <p class="intro">Connect your watch to the HTTPS endpoint for your hermes agent.</p>

    <form id="settings">
      <label for="base-url">Hermes URL</label>
      <input id="base-url" name="baseUrl" type="url" inputmode="url"
             autocomplete="url" autocapitalize="none" spellcheck="false"
             placeholder="https://hermes.example.com" required>
      <small class="hint">Public HTTPS front for the hermes API server. Do not include a path.</small>

      <label for="api-key">Bearer API key</label>
      <input id="api-key" name="apiKey" type="password"
             autocomplete="off" autocapitalize="none" spellcheck="false"
             placeholder="API_SERVER_KEY" required>
      <small class="hint">Stored by the Pebble phone app and sent only to your hermes endpoint.</small>

      <button type="submit">Save</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (function () {
      'use strict';
      var form = document.getElementById('settings');
      var baseUrl = document.getElementById('base-url');
      var apiKey = document.getElementById('api-key');
      var error = document.getElementById('error');

      // pkjs puts the current values in the fragment. Fragments are not sent
      // in the HTTP request to the page host, which keeps the API key private.
      if (location.hash.length > 1) {
        try {
          var current = JSON.parse(decodeURIComponent(location.hash.substring(1)));
          baseUrl.value = current.baseUrl || '';
          apiKey.value = current.apiKey || '';
        } catch (e) { /* open with an empty form */ }
      }

      function queryParam(name, fallback) {
        var query = location.search.substring(1).split('&');
        for (var i = 0; i < query.length; i++) {
          var pair = query[i].split('=');
          if (decodeURIComponent(pair[0] || '') === name) {
            return decodeURIComponent(pair.slice(1).join('=') || '');
          }
        }
        return fallback;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        error.textContent = '';

        var url = baseUrl.value.trim().replace(/\/+$/, '');
        var key = apiKey.value.trim();
        if (!/^https:\/\/[^/\s]+/i.test(url)) {
          error.textContent = 'Enter a valid HTTPS URL.';
          baseUrl.focus();
          return;
        }
        if (!key) {
          error.textContent = 'Enter your Bearer API key.';
          apiKey.focus();
          return;
        }

        var payload = encodeURIComponent(JSON.stringify({ baseUrl: url, apiKey: key }));
        location.href = queryParam('return_to', 'pebblejs://close#') + payload;
      });
    }());
  </script>
</body>
</html>
